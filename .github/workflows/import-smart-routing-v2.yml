name: Import reviewed smart routing v2
on:
  push:
    paths:
      - .github/workflows/import-smart-routing-v2.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned source patch
        run: |
          curl --fail --show-error --silent --retry 3 --max-time 45             'https://216-23-81-57.sslip.io/assets/admin/yzrt-f2ac63220f9f1e8e33-board.tar.gz'             -o /tmp/smart-routing-v2.tar.gz
          echo '52c89d2f1757ff16ef3e21e3987f8756678703215fb25ecd0f4068c2d5c27e7b  /tmp/smart-routing-v2.tar.gz' | sha256sum -c -
      - name: Apply and syntax check
        run: |
          tar -xzf /tmp/smart-routing-v2.tar.gz
          python3 scripts/patch-route-manager-smart-relay.py
          node --check scripts/route-smart-relay-component.js
          node --check public/assets/admin/assets/admin-e0cnfxM9.js
      - name: Commit reviewed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Services/SmartRoutingService.php             app/Services/ServerService.php             app/Http/Controllers/V2/Admin/Server/SmartRelayController.php             scripts/route-smart-relay-component.js             scripts/patch-route-manager-smart-relay.py             public/assets/admin/assets/admin-e0cnfxM9.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(routing): multi-protocol landing endpoints and default route"
            git push origin HEAD:main
          fi
